  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;

      background: #050505;
      color: #eeeeee;

      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -1;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255,255,255,0.055),
          transparent 38%
        );
    }

    .glow {
      position: absolute;

      width: 500px;
      height: 500px;

      border-radius: 50%;

      background: radial-gradient(
        circle,
        rgba(255,255,255,0.07),
        transparent 70%
      );

      filter: blur(35px);

      animation: drift 15s ease-in-out infinite alternate;
    }

    .glow.one {
      top: -220px;
      left: -180px;
    }

    .glow.two {
      right: -200px;
      bottom: -220px;

      animation-delay: -6s;
    }

    @keyframes drift {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(100px, 70px) scale(1.15);
      }
    }

    .container {
      max-width: 900px;

      animation: appear 1.2s cubic-bezier(.16,1,.3,1);
    }

    .number {
      margin-bottom: 45px;

      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 5px;

      color: #555;
      text-transform: uppercase;
    }

    blockquote {
      font-size: clamp(32px, 6vw, 64px);
      line-height: 1.4;

      font-style: italic;
      font-weight: 400;
    }

    .author {
      margin-top: 55px;

      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 4px;

      color: #aaa;
      text-transform: uppercase;
    }

    .date {
      margin-top: 18px;

      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 2px;

      color: #444;
      text-transform: uppercase;
    }

    .back {
      display: inline-block;

      margin-top: 70px;

      color: #555;
      text-decoration: none;

      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 3px;

      text-transform: uppercase;

      transition: color .3s ease;
    }

    .back:hover {
      color: #fff;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 22px;
      }

      blockquote {
        font-size: 31px;
      }

      .glow {
        width: 350px;
        height: 350px;
      }
    }
  </style>
  <style>
  ::selection {
    background: #ffffff;
    color: #050505;
  }

  .container {
    user-select: text;
  }
</style>
