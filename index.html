<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>From Knowing Pain to Cry in Rain — Sasmit Sen</title>

  <meta name="description" content="From knowing pain to cry in rain, I lost. I learned. Hence rose again. — Sasmit Sen">
  <meta name="author" content="Sasmit Sen">
  <meta name="google-site-verification" content="C-WCqM4WhAnpHYf0548o9awfsXvEowVwSrAzjXtRRtk">
  <meta name="robots" content="index, follow">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.06), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.04), transparent 30%),
        #080808;

      color: #f1eee9;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: min(900px, 100%);
      padding: 80px 55px;
      text-align: center;

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;

      background: rgba(255,255,255,0.035);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 30px 100px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,255,0.06);

      animation: appear 1.2s ease forwards;
    }

    .number {
      position: absolute;
      top: 28px;
      left: 35px;

      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: #777;
    }

    .label {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 45px;
    }

    .quote {
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1.38;
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.5px;
    }

    .quote span {
      display: block;
      opacity: 0;
      animation: lineIn 0.8s ease forwards;
    }

    .quote span:nth-child(1) { animation-delay: 0.3s; }
    .quote span:nth-child(2) { animation-delay: 0.6s; }
    .quote span:nth-child(3) { animation-delay: 0.9s; }
    .quote span:nth-child(4) { animation-delay: 1.2s; }

    .divider {
      width: 55px;
      height: 1px;
      margin: 45px auto 25px;
      background: #777;
    }

    .author {
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #c9c4bd;
    }

    .details {
      margin-top: 22px;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: #666;
      text-transform: uppercase;
    }

    .footer {
      position: fixed;
      bottom: 25px;
      left: 0;
      right: 0;

      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 3px;
      color: #444;
      text-transform: uppercase;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes lineIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 60px 25px;
        border-radius: 22px;
      }

      .number {
        top: 20px;
        left: 22px;
      }

      .label {
        margin-bottom: 32px;
        letter-spacing: 4px;
      }

      .quote {
        font-size: 29px;
      }

      .divider {
        margin-top: 35px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="number">01</div>

    <div class="label">Original Quote</div>

    <div class="quote">
      <span>“From knowing pain to cry in rain,</span>
      <span>I lost.</span>
      <span>I learned.</span>
      <span>Hence rose again.”</span>
    </div>

    <div class="divider"></div>

    <div class="author">Sasmit Sen</div>

    <div class="details">
      First published · September 8, 2026
    </div>

  </main>

  <div class="footer">
    An original work by Sasmit Sen
  </div>

</body>
</html>
